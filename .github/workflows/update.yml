# Liam Neeson Tracker - nightly update and website publish.
#
# - Every night at 03:17 UTC: fetch fresh TMDB data + news, commit only if
#   something changed, then publish the website to GitHub Pages.
# - Run it by hand: Actions tab -> "Update data and publish site" -> Run workflow.
# - Whenever you edit a file (e.g. data/screentime.csv) the site is republished
#   (no data fetch), so your changes go live within a couple of minutes.

name: Update data and publish site

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-download details for every title (normally only on Sundays)"
        type: boolean
        default: false
  push:

permissions:
  contents: write   # to commit the refreshed data files
  pages: write      # to publish the website
  id-token: write   # required by GitHub Pages publishing

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Fetch TMDB data and news
        id: fetch
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: python3 scripts/update_data.py

      - name: If TMDB failed, still update the news
        if: steps.fetch.outcome == 'failure'
        run: python3 scripts/update_data.py --news-only

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without a commit.
        # News normally changes daily; this is a safety net for quiet spells.
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > data/keepalive.txt
            echo "Wrote keep-alive file"
          fi

      - name: Commit changes (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Nightly data update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report TMDB failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::The TMDB update failed (news was still updated). Check the 'Fetch TMDB data and news' step above. Most common cause: the TMDB_TOKEN secret is missing or wrong."
          exit 1

  deploy:
    needs: update
    # Publish after the nightly update (even if only news worked) and after any
    # edit pushed to the main branch.
    if: >-
      always() && needs.update.result != 'cancelled' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # latest commit, including tonight's data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
